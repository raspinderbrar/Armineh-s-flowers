<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flower | Armineh Flowers</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
</head>

<body>
    <header>
        <nav class="nav-left">
            <a href="shop.html">shop</a>
            <a href="events.html">events</a>
            <a href="studio.html">studio</a>
            <a href="care.html">care</a>
        </nav>

        <a href="index.html" class="logo">Armineh flowers</a>

        <div class="nav-right">
            <a href="https://www.instagram.com/oneflowerstop/" target="_blank" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </header>

    <main id="productBox"></main>

    <section class="orderOptions">
        <h2>order this bouquet</h2>

        <label for="size">Size</label>
        <select id="size" onchange="updatePrice()">
            <opiton value="0">Small</opiton>
            <option value="30">Medium (+$30)</option>
            <option value="60">Large (+$60)</option>
        </select>

        <label for="deliveryDate">Delivery date</label>
        <input type="date" id="deliveryDate">

        <label for="cardMessage">Card message (optional)</label>
        <textarea id="cardMessage" rows="3"></textarea>

        <p id="totalPrice"></p>

        <button type="button" class="button" onclick="addToCart()">Add to cart</button>
        <p id="cartMessage"></p>

    </section>
    <footer>
        <p>© 2026 Armineh Flowers</p>
        <div>
            <a href="mailto:hello@example.com">email</a>
            <a href="tel:+16045551234">phone</a>
            <a href="shop.html" class="button">Shop</a>
            <a href="https://www.instagram.com/oneflowerstop/" target="_blank" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </footer>
    <script src="products.js"></script>
    <script src="product.js"></script>
</body>

</html>
